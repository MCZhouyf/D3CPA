name: DC3PA Round 5.13 contracts and compatibility audit

on:
  push:
    branches:
      - "round513-chrmlite-cdtlite-v41"
      - "round513cd-chrmlite-data-instrumentation"
      - "round513e0-memory-provenance-rebind"
  pull_request:

jobs:
  hosted-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MP5_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ci/requirements-round11a.txt
      - run: python scripts_dc3pa/run_round5126s_gate.py
      - run: python scripts_dc3pa/run_round513a_gate.py
      - run: python scripts_dc3pa/run_round513b_gate.py
      - run: python scripts_dc3pa/run_round513c_gate.py
      - run: python scripts_dc3pa/run_round513d_gate.py
      - run: python scripts_dc3pa/run_round513e0_gate.py
      - run: python -m pytest -q tests_dc3pa -m "not minedojo"
