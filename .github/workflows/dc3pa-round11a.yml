name: DC3PA Round 1.1a gate

on:
  push:
    branches:
      - round11a-ci-fix
      - round11-infra
      - "round2-*"
      - "round3-*"
      - "round4-*"
      - "round5-*"
      - "round55-*"
      - "round551-*"
      - "round56-*"
      - "round57-*"
      - "round58-*"
      - "round59-*"
      - "round591-*"
      - "round592-*"
      - "round593-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: dc3pa-round11a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MP5_agent

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: MP5_agent/ci/requirements-round11a.txt

      - name: Install hosted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ci/requirements-round11a.txt

      - name: Environment diagnostics
        run: python scripts_dc3pa/run_round11a_gate.py --diagnostics-only

      - name: Focused infrastructure tests
        run: >-
          python scripts_dc3pa/run_round11a_gate.py
          --unit
          --junit artifacts/round11a-focused.xml

      - name: Frozen snapshot smoke
        run: python scripts_dc3pa/round11a_snapshot_smoke.py

      - name: Full hosted infrastructure gate
        run: >-
          python scripts_dc3pa/run_round11a_gate.py
          --full
          --junit artifacts/round11a-full.xml

      - name: Round 2 knowledge V2 gate
        run: >-
          python scripts_dc3pa/run_round2_gate.py
          --junit artifacts/round2.xml

      - name: Round 3 confidence calibration gate
        run: >-
          python scripts_dc3pa/run_round3_gate.py
          --junit artifacts/round3.xml

      - name: Round 4 environment evidence gate
        run: >-
          python scripts_dc3pa/run_round4_gate.py
          --junit artifacts/round4.xml

      - name: Round 5 monotonic fusion gate
        run: >-
          python scripts_dc3pa/run_round5_gate.py
          --junit artifacts/round5.xml

      - name: Round 5.5 real-calibration gate
        run: >-
          python scripts_dc3pa/run_round55_gate.py
          --junit artifacts/round55.xml

      - name: Round 5.5.1 experiment-safety gate
        run: >-
          python scripts_dc3pa/run_round551_gate.py
          --junit artifacts/round551.xml

      - name: Round 5.6 real-experiment pack gate
        run: >-
          python scripts_dc3pa/run_round56_gate.py
          --junit artifacts/round56.xml

      - name: Round 5.7 author-decision dry-run gate
        run: >-
          python scripts_dc3pa/run_round57_gate.py
          --junit artifacts/round57.xml

      - name: Round 5.8 GPT-5.1 reference gate
        run: >-
          python scripts_dc3pa/run_round58_gate.py
          --junit artifacts/round58.xml

      - name: Round 5.9.1 acquisition-readiness gate
        run: >-
          python scripts_dc3pa/run_round59_gate.py
          --junit artifacts/round59.xml

      - name: Round 5.9.2 final-taskset gate
        run: >-
          python scripts_dc3pa/run_round592_gate.py
          --junit artifacts/round592.xml

      - name: Round 5.9.3 Controller/fallback boundary gate
        run: >-
          python scripts_dc3pa/run_round593_gate.py
          --junit artifacts/round593.xml

      - name: Print reports on failure
        if: failure()
        run: |
          echo "Round 1.1a gate failed. Showing available reports."
          find artifacts -maxdepth 2 -type f -print 2>/dev/null || true
          for f in artifacts/*.xml; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
